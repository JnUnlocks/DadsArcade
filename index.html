<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dad's Arcade</title>

    <!-- viewport-fit=cover lets us paint under the notch, then we inset the HUD
         with env(safe-area-inset-*). user-scalable=no kills double-tap zoom,
         which otherwise fires constantly while tapping to shoot. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070f" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="The family arcade in your pocket. Daily puzzles, arcade classics and a shared high-score board. No install, plays offline." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- Link preview card. Scrapers (iMessage, WhatsApp, Slack, Facebook) don't
         run JavaScript and won't resolve relative paths, so og:image and og:url
         must be absolute. Update both if the deployed URL ever changes.

         Nothing here counts the games. The first card said "3 GAMES" under the
         arcade's old name and was still saying it thirteen games later, because
         nothing reminds anyone to update a picture. The card and the words
         describe the arcade instead, so they stay true as it grows.

         A new card needs a new file name: iMessage and the rest keep the old
         picture for as long as the address is the same. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dad&apos;s Arcade" />
    <meta property="og:title" content="Dad&apos;s Arcade" />
    <meta
      property="og:description"
      content="Beat the family's high score. Daily puzzles and arcade classics, made for our family and free to play. No install, plays offline: add it to your home screen."
    />
    <meta property="og:url" content="https://play.hyperdrive-arcade.workers.dev/" />
    <meta
      property="og:image"
      content="https://play.hyperdrive-arcade.workers.dev/og-card.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Dad's Arcade icon, a neon arcade cabinet, beside the words: Beat the family's high score. Daily puzzles and arcade classics."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dad&apos;s Arcade" />
    <meta
      name="twitter:description"
      content="Beat the family's high score. Daily puzzles and arcade classics. No install, plays offline."
    />
    <meta
      name="twitter:image"
      content="https://play.hyperdrive-arcade.workers.dev/og-card.jpg"
    />

    <!-- iOS still needs its own standalone hints; the manifest alone won't do it -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dad's Arcade" />
    <!-- 180px is what an iPhone asks for. Edge to edge, no rounded corners
         of its own: iOS rounds them, and transparent corners would go black. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="ui"></div>
      <!-- Zero-size probe; View reads its computed padding to discover the
           notch and home-indicator insets in a unit it can convert. -->
      <div id="safe-area-probe"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
