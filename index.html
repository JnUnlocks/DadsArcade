<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hyperdrive Arcade</title>

    <!-- viewport-fit=cover lets us paint under the notch, then we inset the HUD
         with env(safe-area-inset-*). user-scalable=no kills double-tap zoom,
         which otherwise fires constantly while tapping to shoot. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070f" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="A pocket arcade. Fly the resistance starfighter." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-512.png" />

    <!-- iOS still needs its own standalone hints; the manifest alone won't do it -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hyperdrive" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="ui"></div>
      <!-- Zero-size probe; View reads its computed padding to discover the
           notch and home-indicator insets in a unit it can convert. -->
      <div id="safe-area-probe"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
