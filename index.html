<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dad's Arcade</title>

    <!-- viewport-fit=cover lets us paint under the notch, then we inset the HUD
         with env(safe-area-inset-*). user-scalable=no kills double-tap zoom,
         which otherwise fires constantly while tapping to shoot. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070f" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="A pocket arcade, built for Dad. Six machines, no install, plays offline." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-512.png" />

    <!-- Link preview card. Scrapers (iMessage, WhatsApp, Slack, Facebook) don't
         run JavaScript and won't resolve relative paths, so og:image and og:url
         must be absolute. Update both if the deployed URL ever changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dad&apos;s Arcade" />
    <meta property="og:title" content="Dad&apos;s Arcade" />
    <meta
      property="og:description"
      content="A family arcade in your pocket. Fly the resistance starfighter, take on Nathan's Mallard Challenge, outswim the jellyfish in Miss Riley's Reef, mix a perfect slime in Riley's Slime Shop, get the frog across the highway, or stack the blocks in Brickfall. Add it to your home screen and chase the high score."
    />
    <meta property="og:url" content="https://play.hyperdrive-arcade.workers.dev/" />
    <meta
      property="og:image"
      content="https://play.hyperdrive-arcade.workers.dev/og.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Three arcade cabinets side by side: Starfighter, Nathan's Mallard Challenge, and Miss Riley's Reef"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dad&apos;s Arcade" />
    <meta
      name="twitter:description"
      content="A family arcade in your pocket. Six games, no install, plays offline."
    />
    <meta
      name="twitter:image"
      content="https://play.hyperdrive-arcade.workers.dev/og.jpg"
    />

    <!-- iOS still needs its own standalone hints; the manifest alone won't do it -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dad's Arcade" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="ui"></div>
      <!-- Zero-size probe; View reads its computed padding to discover the
           notch and home-indicator insets in a unit it can convert. -->
      <div id="safe-area-probe"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
